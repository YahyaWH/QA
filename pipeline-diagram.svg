Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="106.9707" x="716.02" y="1260.5708">3. Add fixture data:</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.4253" x="826.4873" y="1260.5708">{feature}Data.json</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="98.5649" x="716.02" y="1273.3754">4. Add test specs:</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="167.7715" x="818.0815" y="1273.3754">cypress/e2e/FR-XXX/*.cy.ts</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="300.9585" x="716.02" y="1286.1801">The pipeline auto-discovers and processes everything.</text></g><g class="entity" data-qualified-name="GMN36" data-source-line="129" id="ent0037"><path d="M340.91,1514.0163 L340.91,1562.4303 L637.0819,1562.4303 L637.0819,1524.0163 L627.0819,1514.0163 L340.91,1514.0163" fill="#FFFDE7" filter="url(#ft89fu4xwwmza)" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M627.0819,1514.0163 L627.0819,1524.0163 L637.0819,1524.0163 L627.0819,1514.0163" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="26.7104" x="346.91" y="1529.2267">Each</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="131.1353" x="377.117" y="1529.2267">FR-{ID}-{NNN}.cy.ts</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="110.333" x="511.7489" y="1529.2267">file = one test case.</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="189.707" x="346.91" y="1542.0314">Tests use Page Objects + Helpers.</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="268.3022" x="346.91" y="1554.8361">Cypress runs all discovered specs automatically.</text></g><!--entity GSHEET--><g class="entity" data-qualified-name="GSHEET" data-source-line="162" id="ent0055"><path d="M1470.364,2444.1873 C1473.9077,2439.2984 1477.5952,2439.0883 1481.3456,2443.9547 C1484.3953,2438.6263 1489.3989,2437.7435 1493.3047,2442.9861 C1496.2602,2437.3319 1500.0068,2438.0345 1503.8215,2442.0519 C1506.3751,2436.5395 1511.4553,2434.3207 1515.8654,2440.0657 C1518.8554,2434.7347 1523.3789,2434.0619 1527.3189,2439.0068 C1530.6156,2433.5195 1534.2131,2433.0791 1537.9032,2438.6296 C1539.1158,2432.1684 1544.4524,2431.6222 1548.4118,2435.9558 C1553.7389,2429.6986 1557.8688,2430.2907 1561.3906,2437.6736 C1565.2818,2434.2313 1569.0651,2434.7697 1570.9358,2439.9186 C1574.3232,2434.1043 1578.1882,2434.1378 1582.0875,2439.4033 C1587.177,2434.4255 1591.7458,2434.6984 1594.073,2442.0817 C1598.4649,2437.2259 1603.0278,2438.1212 1606.0452,2443.6642 C1609.5531,2438.8403 1613.3806,2439.5481 1615.6381,2444.8489 C1619.076,2439.0841 1623.4044,2438.5441 1627.1933,2444.503 C1634.8278,2447.3352 1636.2041,2452.1322 1630.0281,2457.8892 C1635.0439,2460.7205 1635.1899,2465.9482 1630.5407,2469.2169 C1636.8522,2470.0813 1637.5358,2475.3951 1633.6758,2479.3932 C1637.9976,2484.7152 1637.5218,2489.6682 1630.1408,2491.6015 C1635.2333,2495.545 1635.123,2500.3302 1628.8267,2502.9556 C1634.1267,2507.9044 1633.0772,2512.1589 1626.9917,2515.4333 C1624.1771,2520.3962 1619.6836,2521.5316 1615.9261,2516.4747 C1612.0698,2522.0174 1608.3936,2521.8758 1605.0965,2515.9469 C1602.964,2521.9223 1597.3858,2522.6576 1593.8421,2517.3552 C1590.742,2522.186 1585.7009,2523.15 1582.7316,2517.2201 C1579.7801,2522.4053 1575.0191,2521.5919 1572.5653,2516.7171 C1569.6424,2522.5425 1564.5588,2522.8189 1561.1288,2517.225 C1557.8038,2522.327 1553.4512,2521.9496 1550.1538,2517.1944 C1546.3034,2524.1687 1540.3257,2523.8137 1536.8853,2516.8053 C1534.2537,2521.363 1529.8871,2520.909 1527.1539,2516.9209 C152