8.3965" x="1474.97" y="308.8424">cron (daily)</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="99.8379" x="1474.97" y="322.8112">manual dispatch</text></g><!--entity WF--><g class="entity" data-qualified-name="S7.WF" data-source-line="169" id="ent0058"><rect fill="#D7CCC8" filter="url(#ft89fu4xwwmza)" height="117.7813" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="167.6504" x="1453.17" y="534.7063"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="122.7656" x="1463.17" y="555.8449">Workflow Pipeline</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="135.5977" x="1463.17" y="569.8137">1. Checkout and setup</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="55.9219" x="1463.17" y="583.7824">2. npm ci</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="147.6504" x="1463.17" y="597.7512">3. Cypress run (Chrome)</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="112.0371" x="1463.17" y="611.7199">4. Generate report</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="117.9316" x="1463.17" y="625.6887">5. Upload to Sheets</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="113.7012" x="1463.17" y="639.6574">6. Archive artifacts</text></g><!--entity ART--><g class="entity" data-qualified-name="S7.ART" data-source-line="170" id="ent0059"><rect fill="#D7CCC8" filter="url(#ft89fu4xwwmza)" height="75.875" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="175.2441" x="1449.38" y="913.5063"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="58.3652" x="1459.38" y="93